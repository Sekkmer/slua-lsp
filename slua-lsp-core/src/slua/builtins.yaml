# Canonical built-in Lua/SLua surfaces for completion/typing.
# This is intentionally "best-effort" and conservative.
# Types are Luau-ish strings parsed by sluaTypeFromLuauAnnotationText.
# - "any" becomes unknown
# - tuples can be written as "(t1, t2, ...)"

globals:
  type:
    params: [unknown]
    returns: string
    docs: "type(value): returns the Lua type name"
  tostring:
    params: [unknown]
    returns: string
    docs: "tostring(value): converts to string"
  tonumber:
    params: [unknown, "number | nil"]
    returns: "number | nil"
    docs: "tonumber(value [, base]): invalid input returns nil."
  assert:
    params: [unknown, "string | nil"]
    returns: unknown
    docs: "assert(value [, message])"
  error:
    params: [unknown, "number | nil"]
    returns: nil
    docs: "error(message [, level])"
  pcall:
    params: [function]
    variadic: unknown
    returns:
      tuple: [boolean]
      variadic: unknown
      minimum: 1
    docs: "pcall(fn, ...): protected call. Returns boolean status followed by all results or an error object. Successful calls may return only the status; callback/result-pack types are not inferred."
  xpcall:
    params: [function, function]
    variadic: unknown
    returns:
      tuple: [boolean]
      variadic: unknown
      minimum: 1
    docs: "xpcall(fn, errHandler, ...): protected call with error handler. Returns boolean status followed by all results or an error object. Successful calls may return only the status; callback/result-pack types are not inferred."
  print:
    params: []
    variadic: unknown
    returns: nil
    docs: "print(...): writes values to output"
  next:
    params: [table, "unknown | nil"]
    returns:
      tuple: [unknown, unknown]
      minimum: 1
    docs: "next(table [, index]): key and value, or nil when traversal ends. One or two results."
  pairs:
    params: [table]
    returns:
      tuple: [function, table, unknown]
    docs: "pairs(table): iterator"
  ipairs:
    params: [table]
    returns:
      tuple: [function, table, unknown]
    docs: "ipairs(table): array iterator"
  unpack:
    params: [table, "number | nil", "number | nil"]
    returns: {tuple: [], variadic: unknown, minimum: 0}
    docs: "unpack(table [, i [, j]]): zero or more table values. Element types and range-dependent counts remain unknown."
  select:
    params: ["string | number"]
    variadic: unknown
    returns: {tuple: [], variadic: unknown, minimum: 0}
    docs: "select(index, ...): '#' returns the argument count; a numeric index returns the remaining values, possibly none. Index-dependent result types/counts remain unknown."
  rawget:
    params: [table, unknown]
    returns: unknown
    docs: "rawget(table, key)"
  rawset:
    params: [table, unknown, unknown]
    returns: table
    docs: "rawset(table, key, value)"
  rawequal:
    params: [unknown, unknown]
    returns: boolean
    docs: "rawequal(a, b)"
  rawlen:
    params: [unknown]
    returns: number
    docs: "rawlen(value): length of table or string"
  gcinfo:
    params: []
    returns: number
    docs: "gcinfo(): returns memory usage in KBytes"
  newproxy:
    params: ["boolean | nil"]
    returns: unknown
    docs: "newproxy([withMetatable])"
  getfenv:
    params: ["unknown | nil"]
    returns: table
    docs: "getfenv([f]): get function or thread environment"
  setfenv:
    params: [unknown, table]
    returns: unknown
    docs: "setfenv(f, env): set function or thread environment"
  getmetatable:
    params: [unknown]
    returns: table
    docs: "getmetatable(value)"
  setmetatable:
    params: [table, "table | nil"]
    returns: table
    docs: "setmetatable(table, metatable)"
  dangerouslyexecuterequiredmodule:
    params: [function]
    returns: unknown
    docs: "dangerouslyexecuterequiredmodule(fn): run module body in sandboxed environment"

  # SLua common helpers
  vector:
    params: [number, number, number]
    returns: vector
  rotation:
    params: [number, number, number, number]
    returns: rotation
  quaternion:
    params: [number, number, number, number]
    returns: rotation
  uuid:
    params: ["string | buffer | uuid"]
    returns: uuid
    docs: "uuid(value): string, at least 16 buffer bytes, or an existing UUID. Empty string is the null UUID. Invalid strings, short buffers and nil throw. Alias of uuid.create."
  touuid:
    params: ["string | buffer | uuid | nil"]
    arity: { min: 0, max: 1 }
    returns: "uuid | nil"
    docs: "touuid(value): convert a string, buffer or UUID; invalid strings, short buffers, nil and omission return nil. Empty string is the null UUID."
  tovector:
    params: ["string | vector | nil"]
    arity: { min: 1, max: 1 }
    returns: "vector | nil"
    docs: "tovector(value): parse a vector string or retain a vector. Invalid strings and nil return nil. A supplied argument is required."
  toquaternion:
    params: ["string | rotation | nil"]
    arity: { min: 1, max: 1 }
    returns: "rotation | nil"
    docs: "toquaternion(value): parse a quaternion string or retain a quaternion. Invalid strings and nil return nil. A supplied argument is required."
  torotation:
    params: ["string | rotation | nil"]
    arity: { min: 1, max: 1 }
    returns: "rotation | nil"
    docs: "torotation(value): alias of toquaternion; invalid strings and nil return nil. A supplied argument is required."
  typeof:
    params: [unknown]
    returns: string
    docs: "typeof(value): Luau typeof (engine-defined)"

modules:
  class:
    functions:
      isinstance:
        params: [unknown, {nativeClass: constructor}]
        arity: { min: 2, max: 2 }
        returns: boolean
        docs: "class.isinstance(value, class): test a native class instance. Nonobjects return false; the second argument must be a class. Both arguments must be supplied. Experimental class runtime flag required; no production host availability or flow refinement is implied."
      classof:
        intrinsic: classof
        params: [unknown]
        arity: { min: 1, max: 1 }
        returns: {union: [{nativeClass: constructor}, nil]}
        docs: "class.classof(value): return an instance's class, or nil for a nonobject. The argument must be supplied, including when nil. Known source instances retain their constructor identity. Experimental class runtime flag required; no production host availability is implied."
  llprim:
    values:
      ParamSetter: {"type": {"module": "llprim.ParamSetter"}, "readonly": true, "docs": "Read-only builder metatable. new() constructs a local rule list; apply() changes world state."}
  llprim.ParamSetter:
    functions:
      new: {"params": [], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Create an empty local parameter rule list. Construction does not apply changes. Do not call apply until changes are intended."}
      targetLink: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 34. Returns the same local rule list; does not apply changes."}
      physicsMaterial: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 2. Returns the same local rule list; does not apply changes."}
      physical: {"params": ["table", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 3. Returns the same local rule list; does not apply changes."}
      temporary: {"params": ["table", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 4. Returns the same local rule list; does not apply changes."}
      phantom: {"params": ["table", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 5. Returns the same local rule list; does not apply changes."}
      pos: {"params": ["table", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 6. Returns the same local rule list; does not apply changes."}
      size: {"params": ["table", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 7. Returns the same local rule list; does not apply changes."}
      rot: {"params": ["table", "rotation"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 8. Returns the same local rule list; does not apply changes."}
      primTypeBox: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 0. Returns the same local rule list; does not apply changes."}
      primTypeCylinder: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 1. Returns the same local rule list; does not apply changes."}
      primTypePrism: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 2. Returns the same local rule list; does not apply changes."}
      primTypeSphere: {"params": ["table", "number", "vector", "number", "vector", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 3. Returns the same local rule list; does not apply changes."}
      primTypeTorus: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector", "vector", "vector", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 4. Returns the same local rule list; does not apply changes."}
      primTypeTube: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector", "vector", "vector", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 5. Returns the same local rule list; does not apply changes."}
      primTypeRing: {"params": ["table", "number", "vector", "number", "vector", "vector", "vector", "vector", "vector", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 6. Returns the same local rule list; does not apply changes."}
      primTypeSculpt: {"params": ["table", {"union": ["string", "uuid"]}, "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 9 with variant 7. Returns the same local rule list; does not apply changes."}
      texture: {"params": ["table", "number", {"union": ["string", "uuid"]}, "vector", "vector", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 17. Returns the same local rule list; does not apply changes."}
      color: {"params": ["table", "number", "vector", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 18. Returns the same local rule list; does not apply changes."}
      shinyBump: {"params": ["table", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 19. Returns the same local rule list; does not apply changes."}
      fullbright: {"params": ["table", "number", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 20. Returns the same local rule list; does not apply changes."}
      flexible: {"params": ["table", {"union": ["boolean", "number"]}, "number", "number", "number", "number", "number", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 21. Returns the same local rule list; does not apply changes."}
      texgen: {"params": ["table", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 22. Returns the same local rule list; does not apply changes."}
      pointLight: {"params": ["table", {"union": ["boolean", "number"]}, "vector", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 23. Returns the same local rule list; does not apply changes."}
      glow: {"params": ["table", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 25. Returns the same local rule list; does not apply changes."}
      text: {"params": ["table", "string", "vector", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 26. Returns the same local rule list; does not apply changes."}
      name: {"params": ["table", "string"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 27. Returns the same local rule list; does not apply changes."}
      description: {"params": ["table", "string"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 28. Returns the same local rule list; does not apply changes."}
      rotLocal: {"params": ["table", "rotation"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 29. Returns the same local rule list; does not apply changes."}
      physicsShapeType: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 30. Returns the same local rule list; does not apply changes."}
      omega: {"params": ["table", "vector", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 32. Returns the same local rule list; does not apply changes."}
      posLocal: {"params": ["table", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 33. Returns the same local rule list; does not apply changes."}
      slice: {"params": ["table", "vector"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 35. Returns the same local rule list; does not apply changes."}
      specular: {"params": ["table", "number", {"union": ["string", "uuid"]}, "vector", "vector", "number", "vector", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 36. Returns the same local rule list; does not apply changes."}
      normal: {"params": ["table", "number", {"union": ["string", "uuid"]}, "vector", "vector", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 37. Returns the same local rule list; does not apply changes."}
      alphaMode: {"params": ["table", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 38. Returns the same local rule list; does not apply changes."}
      allowUnsit: {"params": ["table", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 39. Returns the same local rule list; does not apply changes."}
      scriptedSitOnly: {"params": ["table", {"union": ["boolean", "number"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 40. Returns the same local rule list; does not apply changes."}
      sitTarget: {"params": ["table", {"union": ["boolean", "number"]}, "vector", "rotation"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 41. Returns the same local rule list; does not apply changes."}
      projector: {"params": ["table", "string", "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 42. Returns the same local rule list; does not apply changes."}
      clickAction: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 43. Returns the same local rule list; does not apply changes."}
      reflectionProbe: {"params": ["table", {"union": ["boolean", "number"]}, "number", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 44. Returns the same local rule list; does not apply changes."}
      gltfNormal: {"params": ["table", "number", {"union": [{"union": ["string", "uuid"]}, {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 45. Returns the same local rule list; does not apply changes."}
      gltfEmissive: {"params": ["table", "number", {"union": [{"union": ["string", "uuid"]}, {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 46. Returns the same local rule list; does not apply changes."}
      gltfMetallicRoughness: {"params": ["table", "number", {"union": [{"union": ["string", "uuid"]}, {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 47. Returns the same local rule list; does not apply changes."}
      gltfBaseColor: {"params": ["table", "number", {"union": [{"union": ["string", "uuid"]}, {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["vector", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": ["number", {"literal": ""}]}, {"union": [{"union": ["boolean", "number"]}, {"literal": ""}]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 48. Returns the same local rule list; does not apply changes."}
      renderMaterial: {"params": ["table", "number", {"union": ["string", "uuid"]}], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 49. Returns the same local rule list; does not apply changes."}
      sitFlags: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 50. Returns the same local rule list; does not apply changes."}
      damage: {"params": ["table", "number", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 51. Returns the same local rule list; does not apply changes."}
      health: {"params": ["table", "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 52. Returns the same local rule list; does not apply changes."}
      collisionSound: {"params": ["table", {"union": ["string", "uuid"]}, "number"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append PRIM rule 53. Returns the same local rule list; does not apply changes."}
      extend: {"params": ["table", "table"], "returns": {"metatable": "llprim.ParamSetter"}, "docs": "Append another table of rules and return the same local rule list."}
      apply: {"params": ["table", "number | nil"], "returns": "nil", "docs": "Apply rules through ll.SetLinkPrimitiveParamsFast; target defaults to LINK_THIS. Changes world state. Runtime qualification deliberately excludes this operation."}

  # Current SLua-required 64-bit integer library. This table is not callable.
  integer:
    functions:
      create: { params: [number], returns: "integer | nil", docs: "Create a 64-bit integer from an exactly integral, in-range number; otherwise nil." }
      fromstring: { params: [string, "number | nil"], returns: "integer | nil", docs: "Parse a signed 64-bit integer in base 2..36 (default 10); invalid text returns nil." }
      tonumber: { params: [integer], returns: number, docs: "Convert a 64-bit integer to a number; large values can lose precision." }
      neg: { params: [integer], returns: integer }
      bnot: { params: [integer], returns: integer }
      countrz: { params: [integer], returns: integer }
      countlz: { params: [integer], returns: integer }
      bswap: { params: [integer], returns: integer }
      add: { params: [integer, integer], returns: integer }
      sub: { params: [integer, integer], returns: integer }
      mul: { params: [integer, integer], returns: integer }
      div: { params: [integer, integer], returns: integer }
      rem: { params: [integer, integer], returns: integer }
      idiv: { params: [integer, integer], returns: integer }
      udiv: { params: [integer, integer], returns: integer }
      urem: { params: [integer, integer], returns: integer }
      mod: { params: [integer, integer], returns: integer }
      lshift: { params: [integer, integer], returns: integer }
      rshift: { params: [integer, integer], returns: integer }
      arshift: { params: [integer, integer], returns: integer }
      lrotate: { params: [integer, integer], returns: integer }
      rrotate: { params: [integer, integer], returns: integer }
      lt: { params: [integer, integer], returns: boolean }
      le: { params: [integer, integer], returns: boolean }
      ult: { params: [integer, integer], returns: boolean }
      ule: { params: [integer, integer], returns: boolean }
      gt: { params: [integer, integer], returns: boolean }
      ge: { params: [integer, integer], returns: boolean }
      ugt: { params: [integer, integer], returns: boolean }
      uge: { params: [integer, integer], returns: boolean }
      min: { params: [integer], returns: integer, variadic: integer }
      max: { params: [integer], returns: integer, variadic: integer }
      band: { params: [], returns: integer, variadic: integer }
      bor: { params: [], returns: integer, variadic: integer }
      bxor: { params: [], returns: integer, variadic: integer }
      btest: { params: [], returns: boolean, variadic: integer }
      extract: { params: [integer, integer, "integer | nil"], returns: integer }
      replace: { params: [integer, integer, integer, "integer | nil"], returns: integer }
      clamp: { params: [integer, integer, integer], returns: integer }
    values:
      maxsigned: { type: integer, readonly: true, docs: "Maximum signed 64-bit integer (9223372036854775807)." }
      minsigned: { type: integer, readonly: true, docs: "Minimum signed 64-bit integer (-9223372036854775808)." }

  lljson:
    functions:
      encode: { params: [unknown, table], arity: { min: 1, max: 2 }, returns: string, docs: "Encode a JSON value, with an optional options table; explicit nil is rejected." }
      decode: { params: [string, "table | function"], arity: { min: 1, max: 2 }, returns: unknown, docs: "Decode any JSON value, with an optional options table or reviver function; explicit nil is rejected." }
      slencode: { params: [unknown, table], arity: { min: 1, max: 2 }, returns: string }
      sldecode: { params: [string, "table | function"], arity: { min: 1, max: 2 }, returns: unknown }
    values:
      null: { type: unknown, readonly: true }
      remove: { type: unknown, readonly: true, docs: "Sentinel for omitting a value from a JSON replacer or reviver." }
      empty_array: { type: table, readonly: true }
      empty_object: { type: table, readonly: true }
      array_mt: { type: table, readonly: true }
      object_mt: { type: table, readonly: true }

  llbase64:
    functions:
      encode: { params: [string], returns: string }
      decode: { params: [string], returns: string }

  # SLua core custom types exposed as modules (used for module completion and to derive instance members).
  vector:
    functions:
      create: { params: [number, number, number], returns: vector }
      abs: { params: [vector], returns: vector }
      angle: { params: [vector, vector], returns: number }
      ceil: { params: [vector], returns: vector }
      clamp: { params: [vector, vector, vector], returns: vector }
      cross: { params: [vector, vector], returns: vector }
      dot: { params: [vector, vector], returns: number }
      floor: { params: [vector], returns: vector }
      magnitude: { params: [vector], returns: number }
      lerp: { params: [vector, vector, number], returns: vector }
      max: { params: [vector, vector], returns: vector }
      min: { params: [vector, vector], returns: vector }
      normalize: { params: [vector], returns: vector }
      sign: { params: [vector], returns: vector }
    values:
      zero: { type: vector, readonly: true }
      one: { type: vector, readonly: true }

  rotation: &rotationModule
    functions:
      create: { params: [number, number, number, number], returns: rotation }
      conjugate: { params: [rotation], returns: rotation }
      dot: { params: [rotation, rotation], returns: number }
      magnitude: { params: [rotation], returns: number }
      normalize: { params: [rotation], returns: rotation }
      slerp: { params: [rotation, rotation, number], returns: rotation }
      tofwd: { params: [rotation], returns: vector }
      toleft: { params: [rotation], returns: vector }
      toup: { params: [rotation], returns: vector }
    values:
      identity: { type: rotation, readonly: true }

  quaternion: *rotationModule

  uuid:
    functions:
      create: { params: ["string | buffer | uuid"], returns: uuid, docs: "Construct a UUID from a string, buffer of at least 16 bytes, or an existing UUID. Empty string is the null UUID. Invalid strings, short buffers and nil throw." }

  # October SLua native stdlib; generic/variable return packs remain conservative.
  string:
    functions:
      byte: { params: [string, "number | nil", "number | nil"], returns: {tuple: [], variadic: number, minimum: 0}, docs: "string.byte(s [, i [, j]]): zero or more numeric byte values; bounds default to 1 and i. An absent result becomes nil in a value context. Literal range-dependent counts are not inferred." }
      char: { params: [], variadic: number, returns: string, docs: "string.char(...): zero or more numeric bytes to string" }
      len: { params: [string], returns: number }
      sub: { params: [string, number, "number | nil"], returns: string, docs: "string.sub(s, start [, finish]): finish defaults to -1." }
      lower: { params: [string], returns: string }
      upper: { params: [string], returns: string }
      reverse: { params: [string], returns: string }
      rep: { params: [string, number], returns: string }
      find: { params: [string, string, "number | nil", "boolean | nil"], returns: {tuple: ["number | nil", "number | nil"], variadic: unknown, minimum: 1}, docs: "First-match byte bounds followed by an open capture pack; nil when absent. Lua patterns, not PCRE. Capture-dependent types/counts remain unknown." }
      match: { params: [string, string, "number | nil"], returns: {tuple: [], variadic: unknown, minimum: 1}, docs: "First-match substring or all captures, including numeric position captures; nil when absent. Lua patterns, not PCRE. Capture-dependent types/counts remain unknown." }
      gsub: { params: [string, string, "string | table | function", "number | nil"], returns: {tuple: [string, number]} }
      format: { params: [string], variadic: unknown, returns: string, docs: "string.format(fmt, ...); format-specific argument constraints are not modeled." }
      gmatch: { params: [string, string], returns: function, docs: "string.gmatch(s, pattern)" }
      split: { params: [string, "string | nil"], returns: {array: string}, docs: "string.split(s [, sep]): separator defaults to a comma." }
      pack: { params: [string], variadic: unknown, returns: string, docs: "string.pack(fmt, ...)" }
      packsize: { params: [string], returns: number, docs: "string.packsize(fmt)" }
      unpack: { params: [string, string, "number | nil"], returns: {tuple: [], variadic: unknown, minimum: 1}, docs: "Format-dependent values plus next byte position. An open return pack; format-dependent value types/counts are not inferred." }

  table:
